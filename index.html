@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13121a;--card:#1d1c28;--tx:#efeefa;--mut:#9f9db3;--ac:#9a78ff;--bar:#2c2a40;--bd:#2d2b3d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:1.6rem}
.sub{color:var(--mut);margin:0 0 16px;font-size:.9rem}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
input,select{flex:1;min-width:140px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
.item{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.rk{font-weight:700;font-size:1.2rem;color:var(--ac);width:34px;text-align:center}
.nm{font-weight:600}
.meta{color:var(--mut);font-size:.8rem}
.bar{height:8px;border-radius:99px;background:var(--bar);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.grow{flex:1}
.sc{font-size:.85rem;color:var(--mut);min-width:34px;text-align:right}
.det{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd);font-size:.9rem;line-height:1.5}
.item.open .det{display:block}
.seq{margin-top:12px}.ctl{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:.85rem;color:var(--mut)}.ctl button{padding:8px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:.95rem;cursor:pointer}.ctl .bp{flex:none;min-width:0;width:70px;padding:6px}.tr{display:grid;grid-template-columns:54px repeat(16,1fr);gap:2px;margin-bottom:3px;align-items:center}.tr span{font-size:.75rem;color:var(--mut)}.c{height:24px;border-radius:4px;background:var(--bar);cursor:pointer}.c.b{background:var(--bd)}.c.a{background:var(--ac)}.c.now{outline:2px solid var(--tx);outline-offset:-2px}.hint{font-size:.75rem;color:var(--mut);margin-top:6px}
.ctl{flex-wrap:wrap}.ctl .sw{flex:none;min-width:0;width:90px;padding:0}.tr span.mu{cursor:pointer}.tr span.off{opacity:.35;text-decoration:line-through}.ah{font-weight:600;font-size:.9rem;margin-top:14px}.ar{display:grid;gap:2px;margin-top:6px}.ar .h{font-size:.6rem;color:var(--mut);text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.ar .c{cursor:default}.ar .h.cur{color:var(--tx);font-weight:700}.ar .c.cur{outline:2px solid var(--tx);outline-offset:-2px}
.none{color:var(--mut);text-align:center;padding:20px}
.note{color:var(--mut);font-size:.75rem;margin-top:16px}
</style>
</head>

cur={btn:btn,lbl:lbl,mark:mark,iv:setInterval(function(){while(next<c.currentTime+.12){var x=get(n);if(!x){stop();return}var sd=60/st.bpm/4,t=next+(x.s%2?st.sw/100*sd/3:0);
(function(x,t){for(var k=0;k<4;k++)if(x.h[k]&&!st.m[k])hit(c,t,k);setTimeout(function(){if(cur&&cur.btn===btn)mark(x.s,x.sec)},Math.max(0,(t-c.currentTime)*1000))})(x,t);n++;next+=sd}},25)}}
function vl(v){var b=[v&127];while(v>>=7)b.unshift((v&127)|128);return b}
function midi(st){var ev=[],b,i,k,bars=4;
for(b=0;b<bars;b++)for(i=0;i<16;i++)for(k=0;k<4;k++)if(st.g[k][i]&&!st.m[k]){var t=(b*16+i)*120+(i%2?Math.round(st.sw/100*40):0),ch=k===3?0:9,nt=[36,38,42,33][k];ev.push([t,0x90|ch,nt,k===3?90:100],[t+(k===3?100:50),0x80|ch,nt,0])}
ev.sort(function(a,c){return a[0]-c[0]});
var mp=Math.round(6e7/st.bpm),tr=[0,255,81,3,(mp>>16)&255,(mp>>8)&255,mp&255],last=0;
ev.forEach(function(e){tr=tr.concat(vl(e[0]-last),[e[1],e[2],e[3]]);last=e[0]});
tr=tr.concat(vl(Math.max(0,bars*1920-last)),[255,47,0]);
var L=tr.length;return new Uint8Array([77,84,104,100,0,0,0,6,0,0,0,1,1,224,77,84,114,107,(L>>24)&255,(L>>16)&255,(L>>8)&255,L&255].concat(tr))}
function dl(){return Promise.resolve({save:function(r){var a=document.createElement("a");a.href=URL.createObjectURL(r.data);a.download=r.filename;document.body.appendChild(a);a.click();a.remove();return Promise.resolve()}})}
function slug(n){return n.replace(/[^a-z0-9]+/gi,"-").toLowerCase()}
function exp(name,st){dl().then(function(m){return m.save({filename:slug(name)+"-"+st.bpm+"bpm.mid",data:new Blob([midi(st)],{type:"audio/midi"})})})}
var LONG={"Techno":1,"Tech House":1,"Deep House":1,"Progressive House":1,"Trance":1,"Psytrance":1};
function arr(name){var T=SOFT[name]?A2:A1,L=(LONG[name]&&!SOFT[name])?[16,16,32,16,32,16]:null;return T.map(function(a,j){return[a[0],L?L[j]:a[1],a[2],a[3]]})}
var NT=[36,38,42,33],VEL=[100,100,80,90];
function asc(s){return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function meta(ty,s){var b=[],i;s=asc(s);for(i=0;i<s.length;i++)b.push(s.charCodeAt(i)&127);return[255,ty].concat(vl(b.length),b)}
function trk(ev,end){ev.sort(function(a,c){return a[0]-c[0]});var tr=[],last=0;ev.forEach(function(e){tr=tr.concat(vl(e[0]-last),e[1]);last=e[0]});tr=tr.concat(vl(Math.max(0,end-last)),[255,47,0]);var L=tr.length;return[77,84,114,107,(L>>24)&255,(L>>16)&255,(L>>8)&255,L&255].concat(tr)}
function midiArr(st,AR,name){var T=[[],[],[],[]],tick=0,tm=[],mp=Math.round(6e7/st.bpm);
tm.push([0,meta(3,name)],[0,[255,81,3,(mp>>16)&255,(mp>>8)&255,mp&255]],[0,[255,88,4,4,2,24,8]]);
TN.forEach(function(n,k){T[k].push([0,meta(3,n)])});
AR.forEach(function(a){tm.push([tick,meta(6,a[0])]);for(var b=0;b<a[1];b++){var roll=!!a[3]&&b===a[1]-1;
for(var i=0;i<16;i++)for(var k=0;k<4;k++){var on=a[2][k]&&st.g[k][i];if(roll&&k===1)on=1;if(roll&&CUT[name]&&i>=8)on=0;
if(on&&!st.m[k]){var t=tick+i*120+(i%2?Math.round(st.sw/100*40):0);T[k].push([t,[144|k,NT[k],VEL[k]]],[t+(k===3?100:50),[128|k,NT[k],0]])}}tick+=1920}});
var out=[77,84,104,100,0,0,0,6,0,1,0,5,1,224].concat(trk(tm,tick));T.forEach(function(e){out=out.concat(trk(e,tick))});return new Uint8Array(out)}
function expA(name,st,AR){dl().then(function(m){if(!m)return;var z=new JSZip(),fn=name.replace(/[^a-z0-9]+/gi,"-").toLowerCase();z.file(fn+"-arrangement.mid",midiArr(st,AR,name));return z.generateAsync({type:"blob"}).then(function(bl){return m.save({filename:fn+"-arrangement-"+st.bpm+"bpm.zip",data:bl})})}).catch(function(e){if(!e||e.code!=="declined")alert("Export impossible.")})}
function seq(box,name){var p=P[name].split("|"),AR=arr(name);
var st=S[name]||(S[name]={bpm:+p[4],sw:0,m:[0,0,0,0],g:[0,1,2,3].map(function(i){return p[i].split("").map(function(c){return c==="x"})})});
box.innerHTML='<div class="ctl"><button class="pl">▶ Lecture</button><label>BPM <input class="bp" type="number" min="60" max="200"></label><label>Swing <input class="sw" type="range" min="0" max="100"></label><button class="ex">⬇ MIDI</button></div><div class="gr"></div><div class="hint">Clique sur les cases pour changer le rythme, et sur le nom d’une piste pour la couper.</div><div class="ah"></div><div class="ar"></div><div class="ctl"><button class="pa">▶ Lire la structure</button><button class="ea">⬇ MIDI arrangement</button></div><div class="hint h2"></div>';
var bp=box.querySelector('.bp'),sw=box.querySelector('.sw'),gr=box.querySelector('.gr'),ar=box.querySelector('.ar'),pl=box.querySelector('.pl'),pa=box.querySelector('.pa'),ex=box.querySelector('.ex'),cs=[],hs=[],as=[];
box.querySelector('.ah').textContent=SOFT[name]?"Structure du morceau (pas de vrai drop)":"Agencement du drop";
box.querySelector('.h2').textContent="Chiffre = nombre de mesures réelles. À l’écoute, la structure est condensée (÷4).";
bp.value=st.bpm;bp.oninput=function(){var v=+bp.value;if(v>=60&&v<=200)st.bpm=v};
sw.value=st.sw;sw.oninput=function(){st.sw=+sw.value};
dl().then(function(m){if(!m)ex.style.display="none"});
TN.forEach(function(n,t){var r=document.createElement('div');r.className='tr';var sp=document.createElement('span');sp.className='mu'+(st.m[t]?' off':'');sp.textContent=n;sp.onclick=function(){st.m[t]=st.m[t]?0:1;sp.classList.toggle('off')};r.appendChild(sp);cs[t]=[];
for(var i=0;i<16;i++)(function(i){var c=document.createElement('div');c.className='c'+(i%4===0?' b':'')+(st.g[t][i]?' a':'');c.onclick=function(){st.g[t][i]=!st.g[t][i];c.classList.toggle('a')};cs[t][i]=c;r.appendChild(c)})(i);gr.appendChild(r)});
ar.style.gridTemplateColumns="54px "+AR.map(function(a){return a[1]+"fr"}).join(" ");
ar.appendChild(document.createElement('span'));
AR.forEach(function(a,j){var h=document.createElement('div');h.className='h';h.textContent=a[0]+" "+a[1];h.title=a[0]+" : "+a[1]+" mesures";hs[j]=h;ar.appendChild(h)});
TN.forEach(function(n,t){var l=document.createElement('span');l.textContent=n;l.style.cssText="font-size:.75rem;color:var(--mut)";ar.appendChild(l);
AR.forEach(function(a,j){var c=document.createElement('div');c.className='c'+(a[2][t]?' a':'');c.dataset.j=j;as.push(c);ar.appendChild(c)})});
function mark(s,sec){cs.forEach(function(row){row.forEach(function(c,i){c.classList.toggle('now',i===s)})});hs.forEach(function(h,j){h.classList.toggle('cur',j===sec)});as.forEach(function(c){c.classList.toggle('cur',+c.dataset.j===sec)})}
pl.onclick=function(){run(pl,"▶ Lecture",mark,st,function(n){var s=n%16;return{h:[0,1,2,3].map(function(k){return st.g[k][s]}),s:s,sec:-1}})};
var bars=[];AR.forEach(function(a,j){var q2=Math.max(1,Math.round(a[1]/4));for(var b=0;b<q2;b++)bars.push({j:j,m:a[2],roll:!!a[3]&&b===q2-1})});
pa.onclick=function(){run(pa,"▶ Lire la structure",mark,st,function(n){var b=Math.floor(n/16),s=n%16;if(b>=bars.length)return null;var o=bars[b],h=[0,1,2,3].map(function(k){return o.m[k]&&st.g[k][s]});if(o.roll){h[1]=1;if(CUT[name]&&s>=8)h=[0,0,0,0]}return{h:h,s:s,sec:o.j}})};
ex.onclick=function(){exp(name,st)};var ea=box.querySelector('.ea');ea.onclick=function(){expA(name,st,AR)};dl().then(function(m){if(!m)ea.style.display="none"})}
q.oninput=render;s.onchange=render;render();
</script>
